[package]
name = "lanwatch"
version = "0.9.0"
edition = "2024"
authors = ["Richard Vidal-Dorsch"]
license = "MIT OR Apache-2.0"
description = "A library and CLI tool for network device discovery and tracking via DHCP, mDNS, SSDP/UPnP, and OUI identification"
readme = "README.md"
repository = "https://github.com/rvido/lanwatch"
homepage = "https://github.com/rvido/lanwatch"
keywords = ["network", "discovery", "dhcp", "mdns", "device-tracking"]
categories = ["network-programming", "parsing"]

[features]
# Keep default minimal; enable API explicitly to avoid pulling serde_json/tiny_http.
default = []
http-api = ["dep:serde_json", "dep:tiny_http"]
mdns = []
ssdp = []

[dependencies]
pnet_datalink = "0.35"
pnet_packet = "0.35"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
tiny_http = { version = "0.12", optional = true }

[profile.release]
lto = true
strip = true
opt-level = 3
codegen-units = 1
panic = "abort"

# Compile all dependencies with size optimization to shrink binary footprint
[profile.release.package."*"]
opt-level = "z"
